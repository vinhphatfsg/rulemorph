name: Core Performance

on:
  pull_request:
    paths:
      - "crates/rulemorph/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".github/workflows/perf.yml"
      - "scripts/perf_report.py"
      - "docs/perf.md"
  workflow_dispatch:
  schedule:
    # Full benchmark smoke on the default branch. PRs use short canaries only.
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  perf:
    name: rulemorph core perf
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.2 pinned 2026-05-31. Uses Node.js 24 runtime.
      - name: Checkout PR code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          persist-credentials: false

      # actions/checkout@v6.0.2 pinned 2026-05-31. Uses Node.js 24 runtime.
      - name: Checkout trusted base for reporting
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      # dtolnay/rust-toolchain pinned 2026-05-09, matching release-cli.yml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0

      # Swatinem/rust-cache@v2 pinned 2026-05-31.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            pr -> pr/target

      - name: Run rulemorph tests
        working-directory: pr
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: cargo test -p rulemorph

      - name: Run allocation canaries
        working-directory: pr
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: cargo test -p rulemorph --test perf_allocation -- --test-threads=1

      - name: Compile all core benches
        working-directory: pr
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          cargo bench -p rulemorph --bench transform_bench --no-run
          cargo bench -p rulemorph --bench parse_bench --no-run
          cargo bench -p rulemorph --bench normalize_bench --no-run
          cargo bench -p rulemorph --bench exec_mode_bench --no-run
          cargo bench -p rulemorph --bench trace_bench --no-run
          cargo bench -p rulemorph --bench v2_bench --no-run

      - name: Clear previous Criterion results
        working-directory: pr
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: rm -rf target/criterion

      - name: Run short Criterion canaries
        if: github.event_name == 'pull_request'
        working-directory: pr
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          cargo bench -p rulemorph --bench transform_bench -- transform/batch/simple/records_5k --warm-up-time 1 --measurement-time 2
          cargo bench -p rulemorph --bench trace_bench -- trace_off --warm-up-time 1 --measurement-time 2

      - name: Run full Criterion benchmarks
        if: github.event_name != 'pull_request'
        working-directory: pr
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          cargo bench -p rulemorph --bench transform_bench
          cargo bench -p rulemorph --bench parse_bench
          cargo bench -p rulemorph --bench normalize_bench
          cargo bench -p rulemorph --bench exec_mode_bench
          cargo bench -p rulemorph --bench trace_bench
          cargo bench -p rulemorph --bench v2_bench

      - name: Build short performance report
        if: github.event_name == 'pull_request' && hashFiles('trusted/scripts/perf_report.py') != ''
        run: |
          if python3 trusted/scripts/perf_report.py --help | grep -q -- "--hide-missing"; then
            python3 trusted/scripts/perf_report.py --criterion-dir pr/target/criterion --baseline-json trusted/crates/rulemorph/PERF.json --json-output perf-report.json --report-mode short-pr --hide-missing > perf-report.md
          else
            python3 trusted/scripts/perf_report.py --criterion-dir pr/target/criterion --baseline-json trusted/crates/rulemorph/PERF.json --json-output perf-report.json > perf-report.raw.md
            {
              echo "# Rulemorph Core Performance Snapshot"
              echo
              echo "Mode: short PR canary."
              echo "Measured short canary benchmarks only. Baseline-only benchmarks are hidden from this table."
              echo "Criterion wall-clock deltas are advisory; blocking gates are cargo tests, allocation canaries, and bench compilation."
              echo
              awk 'NR <= 2 { next } /\| missing \|$/ { next } { print }' perf-report.raw.md
            } > perf-report.md
          fi

      - name: Build full performance report
        if: github.event_name != 'pull_request' && hashFiles('trusted/scripts/perf_report.py') != ''
        run: python3 trusted/scripts/perf_report.py --criterion-dir pr/target/criterion --baseline-json trusted/crates/rulemorph/PERF.json --json-output perf-report.json --report-mode full > perf-report.md

      - name: Record missing trusted report renderer
        if: hashFiles('trusted/scripts/perf_report.py') == ''
        run: |
          cat > perf-report.md <<'EOF'
          # Rulemorph Core Performance Snapshot

          Trusted perf_report.py is not available on the base ref yet. Criterion JSON artifacts were still uploaded; Markdown rendering will start after the reporting script exists on the base branch.
          EOF
          cat > perf-report.json <<'EOF'
          {
            "schema_version": 1,
            "benchmarks": {},
            "missing_from_current": [],
            "status": "trusted_renderer_missing"
          }
          EOF

      - name: Publish performance summary
        run: cat perf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance artifacts
        # actions/upload-artifact@v4 pinned 2026-05-31.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rulemorph-core-performance
          retention-days: 7
          path: |
            perf-report.md
            perf-report.json
            pr/target/criterion/**/new/*.json
