name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run the browser-dependent e2e suite once per day without making every PR pay for it.
    - cron: "30 18 * * *"

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, tests, and advisory clippy
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.2 pinned 2026-06-11. Uses Node.js 24 runtime.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain pinned 2026-06-11.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      # Swatinem/rust-cache@v2 pinned 2026-06-11.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check formatting
        run: cargo fmt --check

      - name: Check source file sizes
        run: scripts/check-file-sizes.sh --fail

      - name: Check fixture references
        run: python3 scripts/check-fixture-refs.py --deny-unused

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run clippy advisory
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

  ui:
    name: UI unit tests
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.2 pinned 2026-06-11. Uses Node.js 24 runtime.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v6.4.0 pinned 2026-06-11. Uses Node.js 24 runtime.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/rulemorph_ui/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/rulemorph_ui/ui
        run: npm ci

      - name: Run UI unit tests
        working-directory: crates/rulemorph_ui/ui
        run: npm run test

  ui-e2e:
    name: UI e2e tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    steps:
      # actions/checkout@v6.0.2 pinned 2026-06-11. Uses Node.js 24 runtime.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v6.4.0 pinned 2026-06-11. Uses Node.js 24 runtime.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/rulemorph_ui/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/rulemorph_ui/ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: crates/rulemorph_ui/ui
        run: npx playwright install --with-deps chromium

      - name: Run UI e2e tests
        working-directory: crates/rulemorph_ui/ui
        run: npm run test:e2e
