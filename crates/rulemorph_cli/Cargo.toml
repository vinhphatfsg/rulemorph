[package]
name = "rulemorph_cli"
version = "0.3.4"
edition = "2024"
license = "MIT"
description = "CLI for YAML-based declarative data transformation"
repository = "https://github.com/vinhphatfsg/rulemorph"
keywords = ["transform", "yaml", "json", "csv", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "rulemorph"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde_json = "1.0"
toml = "0.8"
rulemorph = { path = "../rulemorph" }
rulemorph_server = { path = "../rulemorph_server", optional = true }
rulemorph_trace = { path = "../rulemorph_trace", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
default = []
server = ["rulemorph_server", "rulemorph_trace", "tokio"]
ui = ["server"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
