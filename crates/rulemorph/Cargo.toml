[package]
name = "rulemorph"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "YAML-based declarative data transformation engine for CSV/JSON to JSON"
repository = "https://github.com/vinhphatfsg/rulemorph"
keywords = ["transform", "yaml", "json", "csv", "etl"]
categories = ["command-line-utilities", "data-structures", "encoding"]

[features]
default = ["excel", "html"]
excel = ["dep:calamine", "dep:zip"]
html = ["dep:scraper"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"
regex = "1.12"
chrono = "0.4"
toml = "0.8"
toml_edit = "0.22"
calamine = { version = "0.26", features = ["dates"], optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
quick-xml = "0.31"
scraper = { version = "0.20", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "transform_bench"
harness = false

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "normalize_bench"
harness = false

[[bench]]
name = "exec_mode_bench"
harness = false

[[bench]]
name = "trace_bench"
harness = false

[[bench]]
name = "v2_bench"
harness = false
